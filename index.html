<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Report - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
        }

        .container-wrapper {
            width: 100%;
            max-width: 900px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 20px;
            color: white;
            animation: slideDown 0.6s ease-out;
        }

        .header-section h1 {
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .header-section p {
            font-size: 0.95em;
            opacity: 0.95;
            font-weight: 300;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        #DivWrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin: 0;
        }

        .other-apps-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .card-link {
            display: block;
            background: white;
            border-radius: 15px;
            padding: 20px 18px;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .card-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .card-link:hover::before {
            left: 100%;
        }

        .card-link:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            border-color: #667eea;
        }

        .card-link.link-1 {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .card-link.link-2 {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.1), rgba(16, 185, 129, 0.1));
        }

        .card-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: inline-block;
        }

        .card-link.link-1 .card-icon {
            color: #667eea;
        }

        .card-link.link-2 .card-icon {
            color: #10b981;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .card-subtitle {
            font-size: 0.85em;
            color: #718096;
            font-weight: 400;
        }

        .footer-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 20px;
            font-size: 0.95em;
            animation: fadeIn 1s ease-out 0.4s both;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .header-section h1 {
                font-size: 2em;
            }

            .card-link {
                padding: 25px 20px;
            }

            .card-icon {
                font-size: 2em;
            }

            .card-title {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container-wrapper">
        <div class="header-section">
            <h1><i class="fas fa-warehouse"></i> Store Report</h1>
            <p>Management System Dashboard</p>
        </div>

        <div id="DivWrapper">
            <a href="storeReport_daily.html" class="card-link link-1" onclick="sessionStorage.setItem('isAuthenticated','true');">
                <div class="card-icon"><i class="fas fa-tools"></i></div>
                <div class="card-title">VIFAA VYA KUAZIMA KUTWA</div>
                <div class="card-subtitle">Daily Equipment Report</div>
            </a>
            <a href="storeReport_good1.html" class="card-link link-2" onclick="sessionStorage.setItem('isAuthenticated','true');">
                <div class="card-icon"><i class="fas fa-tshirt"></i></div>
                <div class="card-title">REPORT YA KUGAWA UNIFORM</div>
                <div class="card-subtitle">Uniform Distribution Report</div>
            </a>
        </div>

        <div style="margin-top: 25px; text-align: center;">
            <p style="color: rgba(255, 255, 255, 0.7); font-size: 0.85em; margin-bottom: 12px;">Other Applications</p>
            <div style="display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 600px; margin: 0 auto;">
                <a href="https://nestorygitpage.github.io/nestBaggingOps/" target="_blank" class="card-link" style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(37, 99, 235, 0.1));">
                    <div class="card-icon" style="color: #3b82f6;"><i class="fas fa-shopping-bag"></i></div>
                    <div class="card-title">BAGGING OPERATIONS</div>
                    <div class="card-subtitle">Bagapp Website</div>
                </a>
            </div>
        </div>

        <div class="footer-text">
            <i class="fas fa-circle" style="font-size: 0.4em; margin-right: 8px;"></i>
            Click on any report to get started
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
      import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAP495Bl7sl2QPpU_oND2Xp0E8hysINkpY",
        authDomain: "nestounused1.firebaseapp.com",
        databaseURL: "https://nestounused1-default-rtdb.firebaseio.com",
        projectId: "nestounused1",
        storageBucket: "nestounused1.appspot.com",
        messagingSenderId: "510760073211",
        appId: "1:510760073211:web:e5726757d052b92405fd5e"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      function askForId() {
        const posterId = prompt("Enter your ID:");

        if (posterId) {
          const idRef = ref(db, 'UserIds/' + posterId);

          get(idRef).then((snapshot) => {
            if (snapshot.exists()) {
              // Store both ID and user name in sessionStorage
              sessionStorage.setItem('userId', posterId);
              sessionStorage.setItem('userName', snapshot.val());
              sessionStorage.setItem('isAuthenticated', 'true');
            } else {
              alert("ID not recognized. Try again.");
              askForId();
            }
          }).catch((error) => {
            console.error("Error fetching ID:", error);
          });
        } else {
          askForId();
        }
      }

      window.addEventListener('load', askForId);
    </script>
</body>
</html>
